name: Build mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build mod jar
        id: build
        run: |
          set +e
          gradle --no-daemon --console=plain clean build 2>&1 | tee /tmp/turboboost-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            tail -n 25 /tmp/turboboost-build.log | while IFS= read -r line; do
              echo "::error file=build.gradle,line=1::$line"
            done
            exit "$result"
          fi
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: turboboost-minecraft-1.20.1-forge
          path: build/libs/turboboost-*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish public download
        if: github.ref == 'refs/heads/arena/a0cf2940-turbo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="turboboost-v1.1.0"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" build/libs/turboboost-1.1.0.jar --clobber
          else
            gh release create "$release_tag" build/libs/turboboost-1.1.0.jar \
              --target "$GITHUB_SHA" \
              --title "TurboBoost 1.1.0 — Minecraft 1.20.1 Forge" \
              --notes-file README.md
          fi

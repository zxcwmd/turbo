name: Build NeoForge mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build mod
        run: |
          set +e
          gradle --no-daemon --console=plain clean build 2>&1 | tee /tmp/turboboost-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            tail -n 30 /tmp/turboboost-build.log | while IFS= read -r line; do
              echo "::error file=build.gradle,line=1::$line"
            done
            exit "$result"
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: turboboost-neoforge-1.21.1
          path: build/libs/turboboost-neoforge-1.21.1-*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish public download
        if: github.ref == 'refs/heads/arena/a0cf2940-turbo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="turboboost-neoforge-1.21.1-v2.0.0"
          jar="build/libs/turboboost-neoforge-1.21.1-2.0.0.jar"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$jar" --clobber
          else
            gh release create "$release_tag" "$jar" \
              --target "$GITHUB_SHA" \
              --title "TurboBoost Ultra 2.0.0 — NeoForge 1.21.1" \
              --notes-file README.md
          fi

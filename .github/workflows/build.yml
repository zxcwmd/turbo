name: Build mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build mod jar
        run: gradle --no-daemon clean build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: turboboost-minecraft-1.20.1-forge
          path: build/libs/turboboost-*.jar
          if-no-files-found: error
          retention-days: 30

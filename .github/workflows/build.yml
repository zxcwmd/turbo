name: Build mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build mod jar
        id: build
        run: |
          set +e
          gradle --no-daemon --console=plain clean build 2>&1 | tee /tmp/turboboost-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            tail -n 25 /tmp/turboboost-build.log | while IFS= read -r line; do
              echo "::error file=build.gradle,line=1::$line"
            done
            exit "$result"
          fi
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: turboboost-minecraft-1.20.1-forge
          path: build/libs/turboboost-*.jar
          if-no-files-found: error
          retention-days: 30
